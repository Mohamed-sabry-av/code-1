<section class="min-h-screen bg-gray-50 p-8">

  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">

      <div>
        <h1 class="text-3xl font-bold text-gray-900">
          Products
        </h1>

        <p class="text-gray-500 mt-1">
          Manage your products
        </p>
      </div>

      <!-- Add Product -->
      <button (click)="openAddModal()" class="bg-blue-600 text-white px-5 py-3 rounded-lg
               font-medium hover:bg-blue-700 transition">
        + Add Product
      </button>

    </div>


    <!-- Products Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">

      <div class="overflow-x-auto">

        <table class="w-full text-left">

          <!-- Table Header -->
          <thead class="bg-gray-100 border-b">
            <tr>

              <th class="px-6 py-4 text-sm font-semibold text-gray-700">
                Product
              </th>


              <th class="px-6 py-4 text-sm font-semibold text-gray-700">
                Price
              </th>

              <th class="px-6 py-4 text-sm font-semibold text-gray-700">
                Stock
              </th>

              <th class="px-6 py-4 text-sm font-semibold text-gray-700">
                Description
              </th>

              <th class="px-6 py-4 text-sm font-semibold text-gray-700 text-right">
                Actions
              </th>

            </tr>
          </thead>


          <!-- Table Body -->
          <tbody class="divide-y">

            @for(product of products(); track product._id){

            <tr class="hover:bg-gray-50">

              <td class="px-6 py-4">
                <div class="flex items-center gap-3">

                  <img src={{product.imageURL}} alt={{product.title}} class="w-12 h-12 rounded-lg object-cover">

                  <span class="font-medium text-gray-800">
                    {{product.title}}
                  </span>

                </div>
              </td>


              <td class="px-6 py-4 font-medium text-gray-800">
                ${{product.price}}
              </td>

              <td class="px-6 py-4 text-gray-600">
                {{product.stock}}
              </td>
              <td class="px-6 py-4 text-gray-600">
                {{product.desc}}
              </td>

              <!-- Actions -->
              <td class="px-6 py-4">

                <div class="flex justify-end gap-2">

                  <button (click)="openEditModal(product)" class="px-4 py-2 text-sm text-blue-600
                           border border-blue-600 rounded-lg
                           hover:bg-blue-50 transition">
                    Edit
                  </button>

                  <button (click)="deleteProucts(product._id!)" class="px-4 py-2 text-sm text-red-600
                           border border-red-600 rounded-lg
                           hover:bg-red-50 transition">
                    Delete
                  </button>

                </div>

              </td>
              @if(showModal()){
                <app-product-form 
                  [product]="editingProduct()"
                  (saved)="onFormSaved()"
                  (cancelled)="showModal.set(false)"
                ></app-product-form>
              }
            </tr>
            }

          </tbody>

        </table>

      </div>

    </div>

  </div>

</section>
