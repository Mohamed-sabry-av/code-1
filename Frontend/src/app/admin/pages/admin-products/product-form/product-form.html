<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">

    <!-- Modal -->
    <div class="bg-white w-full max-w-lg rounded-xl shadow-xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b">

            <h2 class="text-xl font-bold text-gray-800">
                Add Product
            </h2>

            <button class="text-gray-500 hover:text-gray-800 text-2xl">
                &times;
            </button>

        </div>

        <!-- Form -->

        <form class="p-6" [formGroup]="productForm" (ngSubmit)="onSubmit()">

            <!-- Product Name -->
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    Product Name
                </label>

                <input id="name" type="text" placeholder="Enter product name" formControlName="title" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg
                 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Price -->
            <div class="mb-4">
                <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
                    Price
                </label>

                <input id="price" type="number" placeholder="Enter price" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg
                  outline-none focus:ring-2 focus:ring-blue-500" formControlName="price">
            </div>


            <!-- Stock -->
            <div class="mb-4">
                <label for="stock" class="block text-sm font-medium text-gray-700 mb-2">
                    Stock
                </label>

                <input id="stock" type="number" formControlName="stock" placeholder="Enter stock quantity" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg
                 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Description -->
            <div class="mb-6">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                    Description
                </label>

                <textarea id="description" rows="3" formControlName="desc" placeholder="Enter product description"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg
                 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            @if (errorMessage()) {
                <p class="mb-4 text-sm text-red-600">{{ errorMessage() }}</p>
            }

            <!-- Actions -->
            <div class="flex justify-end gap-3">

                <button type="button" (click)="cancelled.emit()" class="px-5 py-2.5 border border-gray-300 rounded-lg
                 text-gray-700 hover:bg-gray-100 transition">
                    Cancel
                </button>

                <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg
                 hover:bg-blue-700 transition">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>
