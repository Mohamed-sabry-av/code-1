<section class="max-w-5xl mx-auto px-6 py-10">

    <h1 class="text-2xl font-bold text-gray-800 mb-6">Manage Users</h1>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-sm">
                <tr>
                    <th class="px-5 py-3">Email</th>
                    <th class="px-5 py-3">Role</th>
                    <th class="px-5 py-3 text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for(user of users(); track user._id){
                <tr class="border-t border-gray-100">
                    <td class="px-5 py-3">{{user.email}}</td>
                    <td class="px-5 py-3">
                        <select [value]="user.role" (change)="onRoleChange(user, $event)"
                            [disabled]="user.email === authService.user()?.email"
                            class="border border-gray-300 rounded-lg px-3 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="user">user</option>
                            <option value="admin">admin</option>
                        </select>
                    </td>
                    <td class="px-5 py-3 text-right">
                        <button (click)="onDelete(user._id)"
                            [disabled]="user.email === authService.user()?.email"
                            class="text-red-600 hover:underline disabled:opacity-40 disabled:cursor-not-allowed">
                            Delete
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>

</section>
