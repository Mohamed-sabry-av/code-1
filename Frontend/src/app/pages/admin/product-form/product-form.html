<section class="max-w-xl mx-auto px-6 py-10">

    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {{isEditMode ? 'Edit Product' : 'New Product'}}
    </h1>

    @if(errorMessage()){
    <p class="text-red-600 text-sm mb-4 bg-red-50 py-2 px-3 rounded-lg">{{errorMessage()}}</p>
    }

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow-sm p-6 space-y-5">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
            <input type="text" formControlName="title"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea formControlName="desc"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Price</label>
            <input type="number" formControlName="price"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Stock</label>
            <input type="text" formControlName="stock"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        @if(!isEditMode){
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Image</label>
            <input type="file" accept="image/*" (change)="onFileSelected($event)"
                class="w-full text-sm text-gray-600">
        </div>
        }

        <button [disabled]="productForm.invalid" type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition disabled:opacity-50">
            {{isEditMode ? 'Save Changes' : 'Create Product'}}
        </button>

    </form>

</section>
