<div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition">
    <a routerLink="/product/{{product._id}}">
        <img [src]="'http://localhost:3000' + product.imageURL" class="w-full h-48 object-cover">
    </a>

    <div class="p-5">

        <h2 class="text-lg font-semibold text-gray-800">
            {{product.title}}
        </h2>

        <p class="text-gray-500 text-sm mt-2">
            {{product.desc | truncate :70}}
        </p>

        <div class="flex items-center justify-between mt-5">

            <span class="text-xl font-bold text-blue-600">
                ${{product.price}}
            </span>

            <span>{{product.stock}}</span>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg
                     hover:bg-blue-700 transition">
                Add to Cart
            </button>

        </div>

    </div>
</div>
